name: Fix visualizer detail panel refresh

on:
  pull_request:
    branches:
      - local-only-okf-skill

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp/fix-panel-refresh-20260803
          fetch-depth: 0

      - name: Patch detail panel feedback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('skills/visualize/scripts/okf_visualize.py')
          text = path.read_text(encoding='utf-8')

          old_css = '.panel { overflow: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 18px; }\n.panel h1 { margin: 0 0 6px; font-size: 22px; }'
          new_css = '''.panel { overflow: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 18px; }
          .panel.panel-updated { animation: panel-updated .42s ease-out; }
          @keyframes panel-updated { from { box-shadow: inset 6px 0 0 var(--accent); background: var(--accent-soft); } to { box-shadow: inset 0 0 0 transparent; background: var(--panel); } }
          .concept-path { margin: 0 0 10px; padding: 8px 10px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent-soft); overflow-wrap: anywhere; }
          .concept-path strong { display: block; margin-bottom: 2px; color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
          .concept-path code { background: transparent; padding: 0; }
          .panel h1 { margin: 0 0 6px; font-size: 22px; }'''
          if text.count(old_css) != 1:
              raise SystemExit(f'CSS marker count: {text.count(old_css)}')
          text = text.replace(old_css, new_css, 1)

          old_header = '''  panel.innerHTML = `
              <h1>${escapeHtml(node.title)}</h1>
              <div>${escapeHtml(node.id)}</div>'''
          new_header = '''  panel.innerHTML = `
              <div class="concept-path"><strong>Selected concept</strong><code>${escapeHtml(node.id)}</code></div>
              <h1>${escapeHtml(node.title)}</h1>'''
          if text.count(old_header) != 1:
              raise SystemExit(f'header marker count: {text.count(old_header)}')
          text = text.replace(old_header, new_header, 1)

          old_after = '''              <div class="body">${renderMarkdown(node.body)}</div>`;
            panel.querySelectorAll("[data-open]")'''
          new_after = '''              <div class="body">${renderMarkdown(node.body)}</div>`;
            panel.scrollTop = 0;
            panel.dataset.selected = id;
            panel.classList.remove("panel-updated");
            void panel.offsetWidth;
            panel.classList.add("panel-updated");
            panel.querySelectorAll("[data-open]")'''
          if text.count(old_after) != 1:
              raise SystemExit(f'panel marker count: {text.count(old_after)}')
          text = text.replace(old_after, new_after, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Checkout complete TWFoodMCP bundle
        uses: actions/checkout@v4
        with:
          repository: NTUT-Vincent/TWFoodMCP
          ref: main
          path: twfoodmcp

      - name: Test patched visualizer
        shell: bash
        run: |
          python -m py_compile skills/visualize/scripts/okf_visualize.py
          python -c "import yaml; print(yaml.__version__)"
          python skills/visualize/scripts/okf_visualize.py twfoodmcp/knowledge -o /tmp/twfood-panel-fixed.html
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('skills/visualize/scripts/okf_visualize.py').read_text(encoding='utf-8')
          html = Path('/tmp/twfood-panel-fixed.html').read_text(encoding='utf-8')
          for marker in [
              'class="concept-path"',
              'panel.scrollTop = 0;',
              'panel.dataset.selected = id;',
              'panel.classList.add("panel-updated");',
          ]:
              assert marker in source, marker
              assert marker in html, marker
          assert not re.search(r'<script[^>]+src=', html, re.I)
          assert not re.search(r'<link[^>]+stylesheet', html, re.I)
          assert not re.search(r'\bfetch\s*\(', html)
          match = re.search(r'<script>\n(.*)\n</script>', html, re.S)
          assert match
          Path('/tmp/twfood-panel-fixed.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/twfood-panel-fixed.js

      - name: Commit clean fix
        shell: bash
        run: |
          rm -f .github/workflows/tmp-fix-panel-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A skills/visualize/scripts/okf_visualize.py .github/workflows/tmp-fix-panel-refresh.yml
          git commit -m "fix: make detail panel changes explicit [skip ci]"
          git push origin HEAD:tmp/fix-panel-refresh-20260803
