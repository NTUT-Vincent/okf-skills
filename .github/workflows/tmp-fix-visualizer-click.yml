name: Fix offline visualizer node clicks

on:
  pull_request:
    branches:
      - local-only-okf-skill

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp/fix-visualizer-click-20260803
          fetch-depth: 0

      - name: Patch pointer capture behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('skills/visualize/scripts/okf_visualize.py')
          text = path.read_text(encoding='utf-8')
          old = '''svg.addEventListener("pointerdown", event => {
            svg.setPointerCapture(event.pointerId);
            const point = clientToSvg(event.clientX, event.clientY);'''
          new = '''svg.addEventListener("pointerdown", event => {
            if (event.button !== undefined && event.button !== 0) return;
            const interactive = event.target.closest?.(".node, .group-label");
            if (interactive) return;
            svg.setPointerCapture(event.pointerId);
            const point = clientToSvg(event.clientX, event.clientY);'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one pointerdown block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Checkout complete TWFoodMCP bundle
        uses: actions/checkout@v4
        with:
          repository: NTUT-Vincent/TWFoodMCP
          ref: main
          path: twfoodmcp

      - name: Test patched visualizer
        shell: bash
        run: |
          python -m py_compile skills/visualize/scripts/okf_visualize.py
          python -c "import yaml; print(yaml.__version__)"
          python skills/visualize/scripts/okf_visualize.py twfoodmcp/knowledge -o /tmp/twfood-click-fixed.html
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('skills/visualize/scripts/okf_visualize.py').read_text(encoding='utf-8')
          html = Path('/tmp/twfood-click-fixed.html').read_text(encoding='utf-8')
          guard = 'const interactive = event.target.closest?.(".node, .group-label");'
          assert guard in source
          assert guard in html
          assert source.index(guard) < source.index('svg.setPointerCapture(event.pointerId);', source.index(guard))
          assert not re.search(r'<script[^>]+src=', html, re.I)
          assert not re.search(r'<link[^>]+stylesheet', html, re.I)
          assert not re.search(r'\bfetch\s*\(', html)
          match = re.search(r'<script>\n(.*)\n</script>', html, re.S)
          assert match
          Path('/tmp/twfood-click-fixed.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/twfood-click-fixed.js

      - name: Commit clean fix
        shell: bash
        run: |
          rm -f .github/workflows/tmp-fix-visualizer-click.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A skills/visualize/scripts/okf_visualize.py .github/workflows/tmp-fix-visualizer-click.yml
          git commit -m "fix: preserve node clicks while panning [skip ci]"
          git push origin HEAD:tmp/fix-visualizer-click-20260803
